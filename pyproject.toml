[project]
name = "excel-model-maker-core"
version = "0.2.0"
description = "Template-preserving numeric-input composer and styled JSON-to-XLSX report builder"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
report = ["openpyxl>=3.1,<4"]

[tool.unittest]
start-directory = "."

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = ["work", "originals", "candidates", "companies"]
